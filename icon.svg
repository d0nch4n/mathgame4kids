<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3b2d71"/>
      <stop offset="60%" stop-color="#18153c"/>
      <stop offset="100%" stop-color="#0a0818"/>
    </radialGradient>

    <!-- Planet Gradient -->
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CEC9"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FD79A8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Rocket Body Gradient -->
    <linearGradient id="rocketBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#DFE6E9"/>
      <stop offset="100%" stop-color="#B2BEC3"/>
    </linearGradient>

    <!-- Red Wing Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7675"/>
      <stop offset="100%" stop-color="#D63031"/>
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="50%" stop-color="#FDCB6E"/>
      <stop offset="100%" stop-color="#E17055"/>
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="100%" stop-color="#FDCB6E"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Background Glow Aura -->
  <circle cx="256" cy="230" r="160" fill="#6C5CE7" opacity="0.28" filter="url(#glow)"/>

  <!-- Background Stars -->
  <g fill="#FFEAA7" opacity="0.85">
    <circle cx="80" cy="90" r="4"/>
    <circle cx="420" cy="110" r="3.5"/>
    <circle cx="100" cy="380" r="3"/>
    <circle cx="440" cy="390" r="4.5"/>
    <circle cx="260" cy="60" r="3"/>
    <circle cx="60" cy="220" r="2.5"/>
    <circle cx="450" cy="240" r="3"/>
    <!-- Sparkle Stars -->
    <path d="M 140 140 Q 140 155 125 155 Q 140 155 140 170 Q 140 155 155 155 Q 140 155 140 140" fill="#FFF" opacity="0.9"/>
    <path d="M 380 90 Q 380 100 370 100 Q 380 100 380 110 Q 380 100 390 100 Q 380 100 380 90" fill="#FFEAA7" opacity="0.9"/>
    <path d="M 400 330 Q 400 342 388 342 Q 400 342 400 354 Q 400 342 412 342 Q 400 342 400 330" fill="#FD79A8" opacity="0.9"/>
  </g>

  <!-- Friendly Saturn Planet (Top Right) -->
  <g transform="translate(360, 160)">
    <ellipse cx="0" cy="0" rx="44" ry="14" fill="url(#ringGrad)" transform="rotate(-24)"/>
    <circle cx="0" cy="0" r="28" fill="url(#planetGrad)"/>
    <path d="M -38 10 A 44 14 0 0 0 38 -10" stroke="#FFEAA7" stroke-width="4" fill="none" transform="rotate(-24)"/>
  </g>

  <!-- Math Symbols Floating (Playful & Colorful) -->
  <!-- Plus Symbol (Cyan) -->
  <g transform="translate(95, 170)" filter="url(#glow)">
    <rect x="-6" y="-22" width="12" height="44" rx="6" fill="#00CEC9"/>
    <rect x="-22" y="-6" width="44" height="12" rx="6" fill="#00CEC9"/>
  </g>

  <!-- Multiplication Symbol (Gold) -->
  <g transform="translate(390, 260) rotate(45)" filter="url(#glow)">
    <rect x="-5" y="-20" width="10" height="40" rx="5" fill="#FDCB6E"/>
    <rect x="-20" y="-5" width="40" height="10" rx="5" fill="#FDCB6E"/>
  </g>

  <!-- Minus Symbol (Pink) -->
  <g transform="translate(110, 310)" filter="url(#glow)">
    <rect x="-20" y="-5" width="40" height="10" rx="5" fill="#FD79A8"/>
  </g>

  <!-- Division Symbol (Green) -->
  <g transform="translate(355, 395)" filter="url(#glow)">
    <circle cx="0" cy="-14" r="5" fill="#00B894"/>
    <rect x="-16" y="-3" width="32" height="6" rx="3" fill="#00B894"/>
    <circle cx="0" cy="14" r="5" fill="#00B894"/>
  </g>

  <!-- Equal Symbol (Gold) -->
  <g transform="translate(160, 85)" filter="url(#glow)">
    <rect x="-15" y="-8" width="30" height="6" rx="3" fill="#FFEAA7"/>
    <rect x="-15" y="4" width="30" height="6" rx="3" fill="#FFEAA7"/>
  </g>

  <!-- ROCKET SHIP (Center, Angled Upwards) -->
  <g transform="translate(256, 230) rotate(-35)">
    <!-- Jet Flame -->
    <path d="M -22 100 Q 0 165 0 175 Q 0 165 22 100 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
    <path d="M -12 100 Q 0 145 0 150 Q 0 145 12 100 Z" fill="#FFF" opacity="0.8"/>

    <!-- Thruster Base -->
    <rect x="-18" y="92" width="36" height="14" rx="4" fill="#636E72"/>

    <!-- Left Wing -->
    <path d="M -38 40 L -72 90 Q -68 96 -50 90 L -38 78 Z" fill="url(#wingGrad)"/>
    <!-- Right Wing -->
    <path d="M 38 40 L 72 90 Q 68 96 50 90 L 38 78 Z" fill="url(#wingGrad)"/>

    <!-- Rocket Fuselage Body -->
    <path d="M 0 -105 C 50 -45 50 65 40 95 L -40 95 C -50 65 -50 -45 0 -105 Z" fill="url(#rocketBody)"/>

    <!-- Nose Cone Cap (Red) -->
    <path d="M 0 -105 C 24 -70 32 -40 34 -25 L -34 -25 C -32 -40 -24 -70 0 -105 Z" fill="url(#wingGrad)"/>

    <!-- Central Porthole Window -->
    <circle cx="0" cy="15" r="26" fill="#00CEC9" stroke="#FFF" stroke-width="6" filter="url(#glow)"/>
    <circle cx="0" cy="15" r="18" fill="#0984E3"/>
    <!-- Glass Highlight Reflection -->
    <path d="M -10 3 A 14 14 0 0 1 8 5" stroke="#FFF" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Center Fin Highlight -->
    <rect x="-3" y="45" width="6" height="50" rx="3" fill="url(#wingGrad)"/>
  </g>

  <!-- Banner / App Name: ASTROMATH -->
  <g transform="translate(256, 452)">
    <rect x="-150" y="-32" width="300" height="48" rx="24" fill="rgba(18, 18, 48, 0.85)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#glow)"/>
    <text x="0" y="2" font-family="'Fredoka', 'Quicksand', 'Chalkboard SE', 'Comic Sans MS', sans-serif" font-size="24" font-weight="900" fill="#FFEAA7" text-anchor="middle" letter-spacing="1.5">ASTROMATH</text>
  </g>
</svg>